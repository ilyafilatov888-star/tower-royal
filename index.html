<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tower Royal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<!-- PeerJS: WebRTC-соединение двух игроков по коду комнаты, без своего сервера -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#120d1a;--panel:#1e1530;--edge:#3a2a5c;--gold:#e8c15a;--vio:#7b4fd0;--txt:#efe7d6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Cinzel,Georgia,serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#hud{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--edge);font-size:14px;font-weight:600}
#hud b{color:var(--gold)}
button{font-family:inherit;color:var(--txt);background:#2c2046;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;min-height:44px}
button:active{background:var(--vio)}
button:disabled{opacity:.4}
#go{background:var(--vio);border-color:var(--gold)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none}
#panel{background:var(--panel);border-top:1px solid var(--edge);padding:6px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row button{flex:1;padding:4px 2px;line-height:1.15;font-size:12px;background:linear-gradient(160deg,#3b2a63,#1e1530);border:1.5px solid var(--gold)}
.row button.on{box-shadow:0 0 10px var(--gold)}
.row small{display:block;color:var(--gold);font-size:11px}

/* Карточка выбранной башни: тёмно-фиолетовый фон + золотая рамка */
#card{position:absolute;left:8px;right:8px;max-width:360px;margin:0 auto;display:flex;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(160deg,#3b2a63 0%,#1e1530 75%);box-shadow:0 6px 22px rgba(0,0,0,.65),inset 0 0 14px rgba(232,193,90,.25);z-index:3}
#card.bot{bottom:8px}
#card.top{top:8px}
#cimg{width:88px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:radial-gradient(circle at 50% 75%,rgba(123,79,208,.55),transparent 72%)}
#cpic{max-width:100%;max-height:120px;object-fit:contain;display:block}
#cico{font-size:48px}
#cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-right:18px}
#ctitle{color:var(--gold);font-weight:800;font-size:15px}
#cstat{font-size:12px}
#cdesc{font-size:11px;opacity:.75;line-height:1.3}
#cbtn{display:flex;gap:6px;margin-top:auto}
#cbtn button{flex:1;min-height:40px;padding:4px;font-size:12px;background:linear-gradient(160deg,#3b2a63,#1e1530);border:1.5px solid var(--gold)}
#cx{position:absolute;top:0;right:2px;min-height:34px;padding:0 8px;background:none;border:none;font-size:16px;color:var(--gold)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 30px var(--gold)}100%{transform:scale(1)}}
#card.pulse{animation:pop .6s}

#ov{position:fixed;inset:0;background:rgba(10,6,16,.94);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.menu{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:320px}
.menu h1{font-size:36px;font-weight:800;margin:0;color:var(--gold);letter-spacing:1px}
.menu p{margin:0;line-height:1.5;opacity:.85;font-size:14px}
.menu button{width:100%;font-size:16px}
.join{display:flex;gap:8px;width:100%}
.join input{flex:1;min-width:0;font-family:inherit;font-size:20px;font-weight:800;letter-spacing:4px;text-align:center;text-transform:uppercase;color:var(--gold);background:#1e1530;border:1.5px solid var(--edge);border-radius:8px;padding:8px}
.join button{width:auto;flex:none}
#roomCode{font-size:54px;letter-spacing:8px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <span>🏰 <b id="hp">100</b></span><span>💰 <b id="gold">0</b></span><span>Волна <b id="wv">0/15</b></span>
  <button id="spd">1x</button><button id="go">Старт</button>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="card" class="hide bot">
    <button id="cx" aria-label="Закрыть">✕</button>
    <div id="cimg"><img id="cpic" alt=""><span id="cico"></span></div>
    <div id="cinfo">
      <div id="ctitle"></div><div id="cstat"></div><div id="cdesc"></div>
      <div id="cbtn"><button id="up"></button><button id="sell"></button></div>
    </div>
  </div>
</div>
<div id="panel"><div class="row" id="tRow"></div><div class="row" id="hRow"></div></div>

<div id="ov">
  <div id="m-main" class="menu">
    <h1>Tower Royal</h1>
    <p>Тёмное фэнтези. Защитите королевский замок от проклятых орд вместе с другом или в одиночку.</p>
    <button id="play" type="button">Одиночная игра</button>
    <button id="mkRoom" type="button">Создать комнату</button>
    <div class="join"><input id="code" maxlength="5" placeholder="КОД" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button id="join" type="button">Подключиться</button></div>
    <p id="st" style="color:var(--gold)">⏳ Скрипт не запущен. Откройте страницу в Safari или Chrome.</p>
  </div>
  <div id="m-wait" class="menu hide">
    <p>Код комнаты — передайте его второму игроку:</p>
    <h1 id="roomCode"></h1>
    <p>Ждём подключения…</p>
    <button id="cancel" type="button">Отмена</button>
  </div>
  <div id="m-end" class="menu hide">
    <h1 id="endT"></h1><p id="endP"></p>
    <button id="again" type="button"></button>
  </div>
</div>

<script>
'use strict';
// Показываем JS-ошибки на экране меню (на iPhone нет консоли)
window.addEventListener('error', e => {
  const s = document.getElementById('st');
  if (s) { s.style.display = 'block'; s.style.color = '#ff7b7b'; s.textContent = 'Ошибка: ' + e.message + ' (строка ' + e.lineno + ')'; }
});

/* ====================== КАРТИНКИ ======================
   Картинки башен для карточки лежат в корне репозитория (TOWER_PIC).
   На карте башни рисуются сверху (top-down) кодом. Если появятся свои
   top-down спрайты — добавьте их в ASSETS: top_archer, top_ice, top_fire, top_holy, top_arcane
   (также bg, castlePlayer, castleEnemy) — они заменят рисунок автоматически. */
const ENABLE_ASSETS = true;
const ASSETS = {
  // top_archer:'top_archer.png', top_ice:'top_ice.png', top_fire:'top_fire.png', top_holy:'top_holy.png',
  // bg:'bg.png', castlePlayer:'castle_player.png', castleEnemy:'castle_enemy.png'
};
const TOWER_PIC = { archer:'tower_archer.png', ice:'tower_ice.png', fire:'tower_fire.png', holy:'tower_holy.png' };
const IMG = {};
if (ENABLE_ASSETS) for (const k in ASSETS) { const i = new Image(); i.onload = () => IMG[k] = i; i.src = ASSETS[k]; }
/** Рисует картинку по ключу по центру (x,y); false → нужна заглушка/рисунок кодом */
function sprite(k, x, y, w, h) { const i = IMG[k]; if (!i) return false; ctx.drawImage(i, x - w/2, y - h/2, w, h); return true; }

/* ====================== ДАННЫЕ ====================== */
const W = 360, H = 640, WIN_WAVE = 15;
// Дорога от замка врага (вверху) к замку игроков (внизу)
const P = [[180,58],[180,130],[70,160],[70,250],[290,290],[290,380],[80,420],[80,490],[180,525],[180,566]];
// Площадки для башен рядом с дорогой
const SLOTS = [[120,95],[240,95],[125,212],[30,200],[185,205],[235,238],[160,335],[232,340],[30,385],[150,455],[240,470],[232,545],[40,545]].map(([x,y]) => ({x,y,t:null}));
const SEG = []; let TOT = 0;
for (let i = 1; i < P.length; i++) { const a = P[i-1], b = P[i], l = Math.hypot(b[0]-a[0], b[1]-a[1]); SEG.push({a,b,l,s:TOT}); TOT += l; }
function at(d) { const s = SEG.find(s => d < s.s + s.l) || SEG[SEG.length-1], t = Math.min(1,(d-s.s)/s.l); return [s.a[0]+(s.b[0]-s.a[0])*t, s.a[1]+(s.b[1]-s.a[1])*t]; }

// Башни: c — цена, dmg, cd — перезарядка (с), rng — дальность
const TOWERS = {
  archer:{n:'Лучники', c:50,  col:'#d9b36c', dmg:9,  cd:.45, rng:82, ico:'🏹', d:'Быстрая стрельба, средняя дальность.'},
  holy:  {n:'Свет',    c:80,  col:'#fff3b0', dmg:7,  cd:.25, rng:76, ico:'✨', d:'Луч и замедление. Вдвое сильнее против нежити.'},
  ice:   {n:'Лёд',     c:90,  col:'#7fd4ff', dmg:8,  cd:.9,  rng:72, ico:'❄️', d:'Заморозка цели и аура замедления.'},
  fire:  {n:'Огонь',   c:100, col:'#ff7a33', dmg:20, cd:1.2, rng:72, ico:'🔥', d:'Урон по площади и поджог.'},
  arcane:{n:'Аркана',  c:120, col:'#c07bff', dmg:22, cd:1.1, rng:80, ico:'⚡', d:'Цепная молния по нескольким целям.'}
};
const LV = [1, 1.7, 2.6];                 // множитель урона по уровням
const upCost = (k, l) => Math.round(TOWERS[k].c * (l === 0 ? .9 : 1.4));
// Монстры: t — g наземный / f летающий / u нежить
const MON = {
  knight:  {hp:60,  sp:34, rw:8,  t:'g', col:'#4a3a6b', r:9},
  wolf:    {hp:35,  sp:78, rw:6,  t:'g', col:'#666',    r:7},
  gargoyle:{hp:45,  sp:46, rw:10, t:'f', col:'#6a9a3a', r:8},
  golem:   {hp:300, sp:20, rw:28, t:'g', col:'#7d7466', r:13, arm:.4, dmg:6},
  mage:    {hp:70,  sp:28, rw:14, t:'u', col:'#d8d2b8', r:9,  summon:1},
  demon:   {hp:90,  sp:32, rw:16, t:'g', col:'#e0452a', r:10, boom:1},
  reaper:  {hp:110, sp:38, rw:18, t:'u', col:'#8a1c2b', r:10, regen:4},
  drake:   {hp:200, sp:36, rw:26, t:'g', col:'#b0402a', r:12, fr:.7, dmg:5},
  skeleton:{hp:25,  sp:40, rw:2,  t:'u', col:'#cfc8a8', r:6},
  boss:    {hp:1400,sp:18, rw:150,t:'g', col:'#2a0a3a', r:18, arm:.2, dmg:25}
};
const UNLOCK = [[1,'knight'],[2,'wolf'],[3,'gargoyle'],[4,'golem'],[5,'mage'],[6,'demon'],[7,'reaper'],[8,'drake']];
// Герои — способности с перезарядкой
const HEROES = {
  knight:  {n:'Рыцарь',   c:120, cd:25, ico:'🛡️'},   // оглушает наземных
  mage:    {n:'Архимаг',  c:100, cd:25, ico:'🔮'},   // бафф башен + лечение замка
  huntress:{n:'Охотница', c:130, cd:25, ico:'🗡️'}    // крит-удары по самым живучим
};
// Кооператив: волны сложнее (больше монстров, выше здоровье), но больше золота и здоровья замка
const COOP = {cnt:1.7, hp:1.4, rw:1.25, bonus:1.5, start:260, castle:120, gap:.8};

/* ====================== СОСТОЯНИЕ ====================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const setT = (el, t) => { t = String(t); if (el.textContent !== t) el.textContent = t; };   // не трогаем DOM без нужды
let g, selBuild = null, selSlot = -1, previewUntil = 0, last = 0, hudT = 0, snapT = 0;
const net = {role:'solo', peer:null, conn:null, out:[], lost:false};   // role: solo | host | guest

function newGame(coop) {
  const mh = coop ? COOP.castle : 100;
  g = {coop:!!coop, hp:mh, mh, gold:coop ? COOP.start : 150, wave:0, speed:1, mons:[], fx:[], q:[], qT:0, active:false, towers:[],
       buff:0, hpS:1, over:false, won:false, endShown:false, mid:0, hcd:{knight:0, mage:0, huntress:0}};
  SLOTS.forEach(s => s.t = null); selBuild = null; selSlot = -1; renderPanel(); hud();
}
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);

/* ====================== ВОЛНЫ И МОНСТРЫ (считает хост или одиночка) ====================== */
function genWave(n) {
  const pool = UNLOCK.filter(u => u[0] <= n).map(u => u[1]), q = [], k = g.coop ? COOP.cnt : 1, gap = g.coop ? COOP.gap : 1;
  for (let i = 0; i < Math.round((6 + n*2)*k); i++) q.push({type:pool[Math.random()*pool.length|0], t:Math.max(.3, (1 - n*.04)*gap)});
  if (n % 5 === 0) q.push({type:'boss', t:2});     // босс каждые 5 волн
  return q;
}
function startWave() {
  if (g.active || g.over) return;
  g.wave++; g.hpS = (1 + .16*(g.wave-1))*(g.coop ? COOP.hp : 1); g.q = genWave(g.wave); g.qT = 0; g.active = true;
}
function spawn(type, d = 0) {
  const b = MON[type], m = {...b, type, id:++g.mid, hp:b.hp*g.hpS, d, slow:1, slowT:0, stun:0, burn:0, burnT:0, sp0:4, x:0, y:0};
  m.max = m.hp; m.rw = Math.round(b.rw*(1 + .05*g.wave)*(g.coop ? COOP.rw : 1)); place(m); g.mons.push(m);
}
function place(m) {  // позиция: летающие — по прямой, остальные — по дороге
  if (m.t === 'f') { const t = Math.min(1, m.d/TOT); m.x = P[0][0] + (P[P.length-1][0]-P[0][0])*t; m.y = P[0][1] + (P[P.length-1][1]-P[0][1])*t; }
  else { const p = at(m.d); m.x = p[0]; m.y = p[1]; }
}
function dmg(m, d, src) {
  if (m.dead) return;
  let x = d*(1 - (m.arm||0));
  if (src === 'fire') x *= 1 - (m.fr||0);
  if (src === 'holy' && m.t === 'u') x *= 2;    // святой свет силён против нежити
  m.hp -= x;
  if (m.hp <= 0) {
    m.dead = true; g.gold += m.rw;
    if (m.boom) {                                // демон взрывается: на время отключает башни рядом
      fx({k:'ring', x:m.x, y:m.y, r:55, c:'#ff5a2a', t:.4});
      g.towers.forEach(t => { if (dist(t, m) < 60) t.off = 2.5; });
    }
  }
}
// Эффект; на хосте копия уходит гостю вместе со снимком состояния
function fx(o) {
  o.T = o.t; if (g.fx.length < 60) g.fx.push(o);
  if (net.role === 'host' && net.out.length < 40) net.out.push({k:o.k, x:o.x, y:o.y, r:o.r, x1:o.x1, y1:o.y1, x2:o.x2, y2:o.y2, c:o.c, t:o.t});
}

/* ====================== ДЕЙСТВИЯ ИГРОКОВ ====================== */
function build(i, k) {
  const s = SLOTS[i];
  if (!s || s.t || !TOWERS[k] || g.over || g.gold < TOWERS[k].c) return;
  g.gold -= TOWERS[k].c;
  s.t = {k, l:0, cd:0, off:0, x:s.x, y:s.y, slot:s, i, ang:-Math.PI/2}; g.towers.push(s.t);
  fx({k:'ring', x:s.x, y:s.y, r:26, c:TOWERS[k].col, t:.35});
}
function upgrade(i) {
  const t = SLOTS[i] && SLOTS[i].t;
  if (!t || t.l >= 2 || g.over || g.gold < upCost(t.k, t.l)) return;
  g.gold -= upCost(t.k, t.l); t.l++;
  fx({k:'ring', x:t.x, y:t.y, r:34, c:'#e8c15a', t:.5});
}
function sell(i) {
  const t = SLOTS[i] && SLOTS[i].t; if (!t || g.over) return;
  let paid = TOWERS[t.k].c; for (let j = 0; j < t.l; j++) paid += upCost(t.k, j);
  g.gold += Math.round(paid*.6); SLOTS[i].t = null; g.towers = g.towers.filter(x => x !== t);
}
function summon(k) {
  const h = HEROES[k];
  if (!h || g.over || g.gold < h.c || g.hcd[k] > 0) return;
  g.gold -= h.c; g.hcd[k] = h.cd;
  const ms = g.mons.filter(m => !m.dead);
  if (k === 'knight') ms.forEach(m => { if (m.t !== 'f') { m.stun = 2.5; dmg(m, 40, 'hero'); } });
  if (k === 'mage') { g.buff = 10; g.hp = Math.min(g.mh, g.hp + 15); }
  if (k === 'huntress') ms.sort((a, b) => b.hp - a.hp).slice(0, 6).forEach(m => {
    const crit = Math.random() < .5 ? 3 : 1.6; dmg(m, 70*crit, 'hero'); fx({k:'ring', x:m.x, y:m.y, r:16, c:'#e060ff', t:.3});
  });
  fx({k:'ring', x:180, y:320, r:180, c:'#e8c15a', t:.5});
}
// Выполнение команды: на хосте/в одиночке — сразу, у гостя — отправка хосту
function exec(c) {
  if (!c) return;
  if (c.c === 'build') build(c.i, c.k); else if (c.c === 'up') upgrade(c.i); else if (c.c === 'sell') sell(c.i);
  else if (c.c === 'hero') summon(c.k); else if (c.c === 'wave') startWave();
}
function act(c) { if (net.role === 'guest') send({t:'cmd', c}); else { exec(c); hud(); } }

/* ====================== ОБНОВЛЕНИЕ (хост / одиночка) ====================== */
function update(dt) {
  if (g.over) return;
  g.buff = Math.max(0, g.buff - dt);
  for (const k in g.hcd) g.hcd[k] = Math.max(0, g.hcd[k] - dt);
  if (g.q.length) { g.qT -= dt; if (g.qT <= 0) { const n = g.q.shift(); spawn(n.type); g.qT = n.t; } }
  for (const m of g.mons) {
    if (m.dead) continue;
    if (m.burnT > 0) { m.burnT -= dt; dmg(m, m.burn*dt, 'burn'); }
    if (m.regen) m.hp = Math.min(m.max, m.hp + m.regen*dt);
    if (m.slowT > 0) m.slowT -= dt; else m.slow = 1;
    if (m.stun > 0) m.stun -= dt;
    else { m.d += m.sp*m.slow*(m.t === 'f' ? 2.1 : 1)*dt; place(m); }   // летающие: путь короче → быстрее
    if (m.summon && (m.sp0 -= dt) <= 0) { m.sp0 = 4; spawn('skeleton', Math.max(0, m.d - 12)); }
    if (m.d >= TOT) { m.dead = true; g.hp -= m.dmg || 3; fx({k:'ring', x:180, y:575, r:30, c:'#ff3030', t:.3}); }
  }
  const alive = g.mons.filter(m => !m.dead);
  for (const t of g.towers) {
    const b = TOWERS[t.k], mul = LV[t.l], rng = b.rng*(1 + .08*t.l);
    if (t.off > 0) { t.off -= dt; continue; }
    if (t.k === 'ice') for (const m of alive) if (dist(t, m) < rng) { const v = .65 - .08*t.l; if (m.slowT <= 0 || m.slow > v) m.slow = v; m.slowT = .3; }
    t.cd -= dt; if (t.cd > 0) continue;
    let tg = null;
    for (const m of alive) if (!m.dead && dist(t, m) < rng && (!tg || m.d > tg.d)) tg = m;   // цель — ближайший к замку
    if (!tg) continue;
    t.ang = Math.atan2(tg.y - t.y, tg.x - t.x);
    t.cd = b.cd/(1 + .1*t.l)/(g.buff > 0 ? 1.5 : 1);
    const d = b.dmg*mul;
    fx({k:'line', x1:t.x, y1:t.y, x2:tg.x, y2:tg.y, c:b.col, t:.12});
    if (t.k === 'archer') dmg(tg, d, 'arrow');
    else if (t.k === 'holy') { dmg(tg, d, 'holy'); tg.slow = .6; tg.slowT = .6; }

    for (const m of g.mons) { if (m.tx !== undefined) { m.x += (m.tx - m.x)*k; m.y += (m.ty - m.y)*k; } }
    for (const f of g.fx) f.t -= dt; g.fx = g.fx.filter(f => f.t > 0);
  } else for (let i = 0; i < g.speed; i++) update(dt);
  if (net.role === 'host') { snapT += dt; if (snapT >= .08) { snapT = 0; if (net.conn && net.conn.open) send(snapshot()); } }
  hudT += dt; if (hudT > .25) { hudT = 0; hud(); }
  draw(time);
}
addEventListener('resize', resize);
newGame(false); resize(); requestAnimationFrame(loop);
$('st').style.display = 'none';       // скрипт запущен — убираем подсказку
</script>
