<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tower Royal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d1a;--panel:#1e1530;--edge:#3a2a5c;--gold:#e8c15a;--vio:#7b4fd0;--txt:#efe7d6;--red:#c0392b;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Cinzel,Georgia,serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#hud{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--edge);font-size:14px;font-weight:600}
#hud b{color:var(--gold)}
button{font-family:inherit;color:var(--txt);background:#2c2046;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;min-height:44px}
button:active{background:var(--vio)}
button:disabled{opacity:.4}
#go{background:var(--vio);border-color:var(--gold)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#sel{display:none;gap:8px;padding:6px 10px;background:#2a1d44;align-items:center;justify-content:space-between;font-size:13px}
#panel{background:var(--panel);border-top:1px solid var(--edge);padding:6px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.row button{flex:1;padding:4px 2px;line-height:1.15;font-size:12px}
.row button.on{border-color:var(--gold);background:#3b2a63}
.row small{display:block;color:var(--gold);font-size:11px}
#ov{position:fixed;inset:0;background:rgba(10,6,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
#ov h1{font-size:38px;font-weight:800;margin:0;color:var(--gold);letter-spacing:1px}
#ov p{margin:0;max-width:300px;line-height:1.5;opacity:.85;font-size:14px}
#ov button{min-width:240px;font-size:16px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <span>🏰 <b id="hp">100</b></span><span>💰 <b id="gold">0</b></span><span>Волна <b id="wv">0/15</b></span>
  <button id="spd">1x</button><button id="go">Старт</button>
</div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="sel"><span id="selTxt"></span><span style="display:flex;gap:6px"><button id="up"></button><button id="sell"></button></span></div>
<div id="panel"><div class="row" id="tRow"></div><div class="row" id="hRow"></div></div>
<div id="ov">
  <h1>Tower Royal</h1>
  <p>Тёмное фэнтези. Защитите королевский замок от проклятых орд: ставьте башни на площадки у дороги и вызывайте героев.</p>
  <p id="st" style="color:var(--gold)">⏳ Скрипт не запущен. Откройте файл в Safari или Chrome, а не в предпросмотре.</p>
  <button id="play" type="button">Играть</button>
  <button disabled>Кооп по коду комнаты (скоро)</button>
</div>

<script>
'use strict';
window.addEventListener('error', e => {
  const s = document.getElementById('st');
  if (s) { s.style.display = 'block'; s.style.color = '#ff7b7b'; s.textContent = 'Ошибка: ' + e.message + ' (строка ' + e.lineno + ')'; }
});
const ENABLE_ASSETS = true;
const ASSETS = { bg:'assets/bg.png', castlePlayer:'assets/castle_player.png', castleEnemy:'assets/castle_enemy.png',
  t_archer:'https://i.ibb.co/jZQRjNkW/IMG-4484.jpg', t_ice:'https://i.ibb.co/TMq0T2Nh/IMG-4483.jpg',
  t_fire:'https://i.ibb.co/sdW3BN23/IMG-4482.jpg', t_holy:'https://i.ibb.co/cXspFD2g/IMG-4485.jpg',
  m_knight:'assets/m_knight.png', m_boss:'assets/m_boss.png', h_knight:'assets/h_knight.png' };
const IMG = {};
if (ENABLE_ASSETS) for (const k in ASSETS) { const i = new Image(); i.onload = () => IMG[k] = i; i.src = ASSETS[k]; }
function sprite(k, x, y, w, h) { const i = IMG[k]; if (!i) return false; ctx.drawImage(i, x - w/2, y - h/2, w, h); return true; }
function spriteFit(k, x, bottom, maxW, maxH) {
  const i = IMG[k]; if (!i) return false;
  const s = Math.min(maxW/i.naturalWidth, maxH/i.naturalHeight), w = i.naturalWidth*s, h = i.naturalHeight*s;
  ctx.drawImage(i, x - w/2, bottom - h, w, h); return true;
}
const W = 360, H = 640, WIN_WAVE = 15;
const P = [[180,58],[180,130],[70,160],[70,250],[290,290],[290,380],[80,420],[80,490],[180,525],[180,566]];
const SLOTS = [[120,95],[240,95],[125,212],[30,200],[185,205],[235,238],[160,335],[232,340],[30,385],[150,455],[240,470],[232,545],[40,545]].map(([x,y]) => ({x,y,t:null}));
const SEG = []; let TOT = 0;
for (let i = 1; i < P.length; i++) { const a = P[i-1], b = P[i], l = Math.hypot(b[0]-a[0], b[1]-a[1]); SEG.push({a,b,l,s:TOT}); TOT += l; }
function at(d) { const s = SEG.find(s => d < s.s + s.l) || SEG[SEG.length-1], t = Math.min(1,(d-s.s)/s.l); return [s.a[0]+(s.b[0]-s.a[0])*t, s.a[1]+(s.b[1]-s.a[1])*t]; }
const TOWERS = {
  archer:{n:'Лучники', c:50,  col:'#d9b36c', dmg:9,  cd:.45, rng:82, ico:'🏹'},
  holy:  {n:'Свет',    c:80,  col:'#fff3b0', dmg:7,  cd:.25, rng:76, ico:'✨'},
  ice:   {n:'Лёд',     c:90,  col:'#7fd4ff', dmg:8,  cd:.9,  rng:72, ico:'❄️'},
  fire:  {n:'Огонь',   c:100, col:'#ff7a33', dmg:20, cd:1.2, rng:72, ico:'🔥'},
  arcane:{n:'Аркана',  c:120, col:'#c07bff', dmg:22, cd:1.1, rng:80, ico:'⚡'}
};
const LV = [1, 1.7, 2.6];
const upCost = (k, l) => Math.round(TOWERS[k].c * (l === 0 ? .9 : 1.4));
const MON = {
  knight:  {hp:60,  sp:34, rw:8,  t:'g', col:'#4a3a6b', r:9},
  wolf:    {hp:35,  sp:78, rw:6,  t:'g', col:'#666',    r:7},
  gargoyle:{hp:45,  sp:46, rw:10, t:'f', col:'#6a9a3a', r:8},
  golem:   {hp:300, sp:20, rw:28, t:'g', col:'#7d7466', r:13, arm:.4, dmg:6},
  mage:    {hp:70,  sp:28, rw:14, t:'u', col:'#d8d2b8', r:9,  summon:1},
  demon:   {hp:90,  sp:32, rw:16, t:'g', col:'#e0452a', r:10, boom:1},
  reaper:  {hp:110, sp:38, rw:18, t:'u', col:'#8a1c2b', r:10, regen:4},
  drake:   {hp:200, sp:36, rw:26, t:'g', col:'#b0402a', r:12, fr:.7, dmg:5},
  skeleton:{hp:25,  sp:40, rw:2,  t:'u', col:'#cfc8a8', r:6},
  boss:    {hp:1400,sp:18, rw:150,t:'g', col:'#2a0a3a', r:18, arm:.2, dmg:25}
};
const UNLOCK = [[1,'knight'],[2,'wolf'],[3,'gargoyle'],[4,'golem'],[5,'mage'],[6,'demon'],[7,'reaper'],[8,'drake']];
const HEROES = {
  knight:  {n:'Рыцарь',   c:120, cd:25, ico:'🛡️'},
  mage:    {n:'Архимаг',  c:100, cd:25, ico:'🔮'},
  huntress:{n:'Охотница', c:130, cd:25, ico:'🗡️'}
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let g, selBuild = null, selTower = null, last = 0, hudT = 0;
function newGame() {
  g = {hp:100, gold:150, wave:0, speed:1, mons:[], fx:[], q:[], qT:0, active:false, towers:[], buff:0, hpS:1, over:false, hcd:{knight:0,mage:0,huntress:0}};
  SLOTS.forEach(s => s.t = null); selBuild = selTower = null; renderPanel(); hud();
}
const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
function genWave(n) {
  const pool = UNLOCK.filter(u => u[0] <= n).map(u => u[1]), q = [];
  for (let i = 0; i < 6 + n*2; i++) q.push({type:pool[Math.random()*pool.length|0], t:Math.max(.35, 1 - n*.04)});
  if (n % 5 === 0) q.push({type:'boss', t:2});
  return q;
}
function startWave() {
  if (g.active || g.over) return;
  g.wave++; g.hpS = 1 + .16*(g.wave-1); g.q = genWave(g.wave); g.qT = 0; g.active = true; hud();
}
function spawn(type, d = 0) {
  const b = MON[type], m = {...b, type, hp:b.hp*g.hpS, d, slow:1, slowT:0, stun:0, burn:0, burnT:0, sp0:4, x:0, y:0};
  m.max = m.hp; m.rw = Math.round(b.rw*(1 + .05*g.wave)); place(m); g.mons.push(m);
}
function place(m) {
  if (m.t === 'f') { const t = Math.min(1, m.d/TOT); m.x = P[0][0] + (P[P.length-1][0]-P[0][0])*t; m.y = P[0][1] + (P[P.length-1][1]-P[0][1])*t; }
  else { const p = at(m.d); m.x = p[0]; m.y = p[1]; }
}
function dmg(m, d, src) {
  if (m.dead) return;
  let x = d*(1 - (m.arm||0));
  if (src === 'fire') x *= 1 - (m.fr||0);
  if (src === 'holy' && m.t === 'u') x *= 2;
  m.hp -= x;
  if (m.hp <= 0) {
    m.dead = true; g.gold += m.rw;
    if (m.boom) {
      fx({k:'ring', x:m.x, y:m.y, r:55, c:'#ff5a2a', t:.4});
      g.towers.forEach(t => { if (dist(t, m) < 60) t.off = 2.5; });
    }
  }
}
function fx(o) { o.T = o.t; if (g.fx.length < 60) g.fx.push(o); }
function update(dt) {
  if (g.over) return;
  g.buff = Math.max(0, g.buff - dt);
  for (const k in g.hcd) g.hcd[k] = Math.max(0, g.hcd[k] - dt);
  if (g.q.length) { g.qT -= dt; if (g.qT <= 0) { const n = g.q.shift(); spawn(n.type); g.qT = n.t; } }
  for (const m of g.mons) {
    if (m.dead) continue;
    if (m.burnT > 0) { m.burnT -= dt; dmg(m, m.burn*dt, 'burn'); }
    if (m.regen) m.hp = Math.min(m.max, m.hp + m.regen*dt);
    if (m.slowT > 0) m.slowT -= dt; else m.slow = 1;
    if (m.stun > 0) m.stun -= dt;
    else {
      m.d += m.sp*m.slow*(m.t === 'f' ? 2.1 : 1)*dt;
      place(m);
    }
    if (m.summon && (m.sp0 -= dt) <= 0) { m.sp0 = 4; spawn('skeleton', Math.max(0, m.d - 12)); }
    if (m.d >= TOT) { m.dead = m.gone = true; g.hp -= m.dmg || 3; fx({k:'ring', x:180, y:575, r:30, c:'#ff3030', t:.3}); }
  }
  const alive = g.mons.filter(m => !m.dead);
  for (const t of g.towers) {
    const b = TOWERS[t.k], mul = LV[t.l], rng = b.rng*(1 + .08*t.l);
    if (t.off > 0) { t.off -= dt; continue; }
    if (t.k === 'ice') for (const m of alive) if (dist(t, m) < rng) { const v = .65 - .08*t.l; if (m.slowT <= 0 || m.slow > v) m.slow = v; m.slowT = .3; }
    t.cd -= dt; if (t.cd > 0) continue;
    let tg = null;
    for (const m of alive) if (!m.dead && dist(t, m) < rng && (!tg || m.d > tg.d)) tg = m;
    if (!tg) continue;
    t.cd = b.cd/(1 + .1*t.l)/(g.buff > 0 ? 1.5 : 1);
    const d = b.dmg*mul;
    fx({k:'line', x1:t.x, y1:t.y, x2:tg.x, y2:tg.y, c:b.col, t:.12});
    if (t.k === 'archer') dmg(tg, d, 'arrow');
    else if (t.k === 'holy') { dmg(tg, d, 'holy'); tg.slow = .6; tg.slowT = .6; }
    else if (t.k === 'ice') { dmg(tg, d, 'ice'); tg.stun = Math.max(tg.stun, .5 + .2*t.l); }
    else if (t.k === 'fire') {
      fx({k:'ring', x:tg.x, y:tg.y, r:38, c:b.col, t:.25});
      for (const m of alive) if (dist(m, tg) < 38) { dmg(m, d, 'fire'); m.burn = 5*mul; m.burnT = 3; }
    } else {
      let cur = tg, left = 3 + t.l, hit = new Set(), dd = d;
      while (cur && left-- > 0) {
        hit.add(cur); dmg(cur, dd, 'arc'); dd *= .75;
        const nx = alive.find(m => !hit.has(m) && !m.dead && dist(m, cur) < 62);
        if (nx) fx({k:'line', x1:cur.x, y1:cur.y, x2:nx.x, y2:nx.y, c:b.col, t:.15});
        cur = nx;
      }
    }
  }
  g.mons = g.mons.filter(m => !m.dead);
  for (const f of g.fx) f.t -= dt; g.fx = g.fx.filter(f => f.t > 0);
  if (g.hp <= 0) { g.hp = 0; end(false); }
  else if (g.active && !g.q.length && !g.mons.length) {
    g.active = false; g.gold += 20 + g.wave*3;
    if (g.wave >= WIN_WAVE) end(true);
  }
}
function end(win) {
  g.over = true; const o = $('ov'); o.classList.remove('hide');
  o.innerHTML = `<h1>${win ? 'Победа!' : 'Поражение'}</h1><p>${win ? 'Замок устоял — тьма отступила.' : 'Проклятые орды захватили замок. Дошли до волны ' + g.wave + '.'}</p><button id="again">Играть снова</button>`;
  $('again').onclick = () => { o.classList.add('hide'); newGame(); };
}
function summon(k) {
  const h = HEROES[k];
  if (g.over || g.gold < h.c || g.hcd[k] > 0) return;
  g.gold -= h.c; g.hcd[k] = h.cd;
  const ms = g.mons.filter(m => !m.dead);
  if (k === 'knight') ms.forEach(m => { if (m.t !== 'f') { m.stun = 2.5; dmg(m, 40, 'hero'); } });
  if (k === 'mage') { g.buff = 10; g.hp = Math.min(100, g.hp + 15); }
  if (k === 'huntress') ms.sort((a, b) => b.hp - a.hp).slice(0, 6).forEach(m => {
    const crit = Math.random() < .5 ? 3 : 1.6; dmg(m, 70*crit, 'hero'); fx({k:'ring', x:m.x, y:m.y, r:16, c:'#e060ff', t:.3});
  });
  fx({k:'ring', x:180, y:320, r:180, c:'#e8c15a', t:.5});
  hud();
}
cv.addEventListener('pointerdown', e => {
  if (g.over) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left)/r.width*W, y = (e.clientY - r.top)/r.height*H;
  const s = SLOTS.find(s => Math.hypot(s.x-x, s.y-y) < 30 || (s.t && Math.abs(s.x-x) < 32 && y > s.y-62 && y < s.y+16));
  if (!s) { selTower = null; hud(); return; }
  if (s.t) { selTower = s.t; selBuild = null; renderPanel(); hud(); return; }
  if (selBuild && g.gold >= TOWERS[selBuild].c) {
    g.gold -= TOWERS[selBuild].c;
    s.t = {k:selBuild, l:0, cd:0, off:0, x:s.x, y:s.y, slot:s}; g.towers.push(s.t); hud();
  }
});
$('go').onclick = startWave;
$('spd').onclick = () => { g.speed = g.speed === 1 ? 2 : 1; hud(); };
$('up').onclick = () => { const t = selTower; if (t && t.l < 2 && g.gold >= upCost(t.k, t.l)) { g.gold -= upCost(t.k, t.l); t.l++; hud(); } };
$('sell').onclick = () => {
  const t = selTower; if (!t) return;
  let paid = TOWERS[t.k].c; for (let i = 0; i < t.l; i++) paid += upCost(t.k, i);
  g.gold += Math.round(paid*.6); t.slot.t = null; g.towers = g.towers.filter(x => x !== t); selTower = null; hud();
};
function startGame(e) {
  if (e) e.preventDefault();
  try { $('ov').classList.add('hide'); newGame(); resize(); }
  catch (err) { $('ov').classList.remove('hide'); const s = $('st'); if (s) { s.style.display = 'block'; s.textContent = 'Ошибка запуска: ' + err.message; } }
}
$('play').addEventListener('click', startGame);
$('play').addEventListener('touchend', startGame, {passive:false});
function renderPanel() {
  $('tRow').innerHTML = Object.keys(TOWERS).map(k => `<button data-t="${k}" class="${selBuild === k ? 'on' : ''}">${TOWERS[k].ico}<br>${TOWERS[k].n}<small>${TOWERS[k].c}</small></button>`).join('');
  $('hRow').innerHTML = Object.keys(HEROES).map(k => `<button data-h="${k}">${HEROES[k].ico} ${HEROES[k].n}<small></small></button>`).join('');
  $('tRow').querySelectorAll('button').forEach(b => b.onclick = () => { selBuild = selBuild === b.dataset.t ? null : b.dataset.t; selTower = null; renderPanel(); hud(); });
  $('hRow').querySelectorAll('button').forEach(b => b.onclick = () => summon(b.dataset.h));
}
function hud() {
  $('hp').textContent = g.hp; $('gold').textContent = Math.floor(g.gold); $('wv').textContent = g.wave + '/' + WIN_WAVE;
  $('spd').textContent = g.speed + 'x'; $('go').disabled = g.active || g.over; $('go').textContent = g.active ? '…' : 'Волна ' + (g.wave+1);
  $('tRow').querySelectorAll('button').forEach(b => b.disabled = g.gold < TOWERS[b.dataset.t].c);
  $('hRow').querySelectorAll('button').forEach(b => { const k = b.dataset.h; b.disabled = g.gold < HEROES[k].c || g.hcd[k] > 0; b.querySelector('small').textContent = g.hcd[k] > 0 ? Math.ceil(g.hcd[k]) + ' c' : HEROES[k].c; });
  const t = selTower;
  $('sel').style.display = t ? 'flex' : 'none';
  if (t) {
    $('selTxt').textContent = `${TOWERS[t.k].n} · ур. ${t.l+1}`;
    $('up').textContent = t.l < 2 ? 'Улучшить ' + upCost(t.k, t.l) : 'Макс.'; $('up').disabled = t.l >= 2 || g.gold < upCost(t.k, t.l);
    let paid = TOWERS[t.k].c; for (let i = 0; i < t.l; i++) paid += upCost(t.k, i);
    $('sell').textContent = 'Продать +' + Math.round(paid*.6);
  }
  resize();
}
function drawBG() {
  if (sprite('bg', W/2, H/2, W, H)) return;
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1b1426'); gr.addColorStop(1, '#17261c');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const [w, c] of [[34, '#4a3d2e'], [26, '#2e251c']]) {
    ctx.lineWidth = w; ctx.strokeStyle = c; ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  }
}
function drawCastles() {
  if (!sprite('castleEnemy', 180, 30, 120, 70)) {
    ctx.fillStyle = '#241530'; ctx.fillRect(110, 0, 140, 52);
    for (let x = 114; x < 250; x += 28) { ctx.fillRect(x, -4, 16, 12); }
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(150, 28, 8, 6); ctx.fillRect(202, 28, 8, 6);
    ctx.fillStyle = '#0a0610'; ctx.fillRect(168, 34, 24, 18);
  }
  if (!sprite('castlePlayer', 180, 600, 150, 80)) {
    ctx.fillStyle = '#f2ecdc'; ctx.fillRect(100, 566, 160, 74);
    ctx.fillStyle = '#e8c15a'; ctx.fillRect(100, 562, 160, 6);
    for (let x = 104; x < 260; x += 26) ctx.fillRect(x, 556, 14, 8);
    ctx.fillStyle = '#7b4fd0'; for (const x of [118, 236]) { ctx.fillRect(x, 580, 14, 36); }
    ctx.fillStyle = '#3a2a5c'; ctx.fillRect(166, 600, 28, 40);
    ctx.fillStyle = '#e8c15a'; ctx.beginPath(); ctx.moveTo(168, 556); ctx.lineTo(172, 544); ctx.lineTo(180, 552); ctx.lineTo(188, 544); ctx.lineTo(192, 556); ctx.fill();
  }
}
function drawTower(t) {
  const b = TOWERS[t.k];
  if (t.off > 0) ctx.globalAlpha = .45;
  if (!spriteFit('t_' + t.k, t.x, t.y + 16, 72, 80)) {
    ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.ico, t.x, t.y - 8);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e8c15a'; for (let i = 0; i <= t.l; i++) ctx.fillRect(t.x - 8 + i*6, t.y + 19, 4, 3);
  if (t === selTower) { ctx.strokeStyle = '#e8c15a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(t.x, t.y, b.rng*(1 + .08*t.l), 0, 7); ctx.stroke(); }
}
function draw(time) {
  ctx.clearRect(0, 0, W, H); drawBG(); drawCastles();
  const pulse = .5 + .5*Math.sin(time/250);
  for (const s of SLOTS) if (!s.t) {
    ctx.strokeStyle = selBuild ? `rgba(232,193,90,${.5 + .5*pulse})` : 'rgba(255,255,255,.18)';
    ctx.lineWidth = selBuild ? 2 : 1; ctx.beginPath(); ctx.arc(s.x, s.y, 14, 0, 7); ctx.stroke();
  }
  g.towers.slice().sort((a, b) => a.y - b.y).forEach(drawTower);
  for (const m of g.mons) {
    if (m.t === 'f') { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(m.x, m.y + 10, m.r*.8, 0, 7); ctx.fill(); }
    const y = m.t === 'f' ? m.y - 6 : m.y;
    if (!sprite('m_' + m.type, m.x, y, m.r*2.4, m.r*2.4)) {
      ctx.fillStyle = m.stun > 0 ? '#9fe' : m.slow < 1 ? '#7ac' : m.col; ctx.beginPath(); ctx.arc(m.x, y, m.r, 0, 7); ctx.fill();
      if (m.burnT > 0) { ctx.strokeStyle = '#f73'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    if (m.hp < m.max) { ctx.fillStyle = '#300'; ctx.fillRect(m.x - 10, y - m.r - 6, 20, 3); ctx.fillStyle = '#e44'; ctx.fillRect(m.x - 10, y - m.r - 6, 20*m.hp/m.max, 3); }
  }
  for (const f of g.fx) {
    ctx.globalAlpha = f.t/f.T; ctx.strokeStyle = f.c; ctx.lineWidth = 2; ctx.beginPath();
    if (f.k === 'line') { ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); } else ctx.arc(f.x, f.y, f.r*(1 - f.t/f.T*.5), 0, 7);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (g.buff > 0) { ctx.fillStyle = '#e8c15a'; ctx.font = '12px Cinzel,serif'; ctx.fillText('Бафф башен ' + Math.ceil(g.buff), 8, 18); }
}
function resize() {
  const st = $('stage'), sc = Math.min(st.clientWidth/W, st.clientHeight/H), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(W*sc), ch = Math.floor(H*sc);
  if (cv.style.width !== cw + 'px' || cv.style.height !== ch + 'px') {
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; cv.width = cw*dpr; cv.height = ch*dpr;
    ctx.setTransform(cw*dpr/W, 0, 0, ch*dpr/H, 0, 0);
  }
}
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (time - last)/1000 || 0); last = time;
  for (let i = 0; i < g.speed; i++) update(dt);
  hudT += dt; if (hudT > .25) { hudT = 0; hud(); }
  draw(time);
}
addEventListener('resize', resize);
newGame(); resize(); requestAnimationFrame(loop);
$('st').style.display = 'none';
</script>
