<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0612">
<title>Tower Royal</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--gold:#e8b84a;--gold2:#fff1b8;--pur:#2b1446;--pur2:#4a2275;--dark:#0b0612}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;color:#f3e6c8;
 font-family:"Cinzel","Palatino Linotype","Book Antiqua",Georgia,serif;
 background:radial-gradient(ellipse at 50% 0%,#3a1a5e 0%,#160a26 55%,#07030c 100%)}
button{font-family:inherit;cursor:pointer}
#menuFx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* top bar */
#topbar{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;
 padding:calc(8px + env(safe-area-inset-top)) 10px 6px;pointer-events:none}
#topbar>*{pointer-events:auto}
#lvlBadge{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:30px;
 background:linear-gradient(#3a1a5e,#1a0b2e);border:2px solid var(--gold);box-shadow:0 2px 10px #000a}
#lvlBadge .lv{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#2a1400;
 background:radial-gradient(circle at 35% 30%,#fff1b8,#e8b84a 60%,#a8741a);border:2px solid #fff1b8}
#lvlBadge small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--gold2);opacity:.8}
.xpbar{width:64px;height:7px;border-radius:5px;background:#000a;border:1px solid #6b4a12;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8e44ff,#d9a8ff);width:0;transition:width .5s}
#goldBadge{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 6px;border-radius:30px;font-weight:900;font-size:16px;
 background:linear-gradient(#3a1a5e,#1a0b2e);border:2px solid var(--gold);box-shadow:0 2px 10px #000a}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c8,#ffd24a 55%,#b9851a);border:2px solid #8a5d10;display:inline-block;box-shadow:inset 0 0 4px #fff8}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;z-index:5;
 padding:calc(58px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;
 opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto}
#curtain{position:fixed;inset:0;background:#05020a;z-index:90;opacity:0;pointer-events:none;transition:opacity .28s}
#curtain.on{opacity:1;pointer-events:auto}
.logo{text-align:center;margin:6px 0 14px;position:relative;z-index:2}
.logo .crown{font-size:34px;color:var(--gold);text-shadow:0 0 18px #ffb300;animation:float 3s ease-in-out infinite}
.logo h1{margin:0;font-size:46px;line-height:.95;letter-spacing:4px;font-weight:900;
 background:linear-gradient(#fff6cf,#e8b84a 55%,#8c5a14);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #3a1f00) drop-shadow(0 0 14px rgba(180,90,255,.6))}
.logo p{margin:8px 0 0;font-size:12px;letter-spacing:3px;color:#c9a6ff;text-transform:uppercase}
.menuBtns{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;position:relative;z-index:2}
.bigbtn{width:100%;max-width:340px;padding:18px 10px;font-weight:900;font-size:22px;letter-spacing:1px;color:#2a1400;
 background:linear-gradient(#ffe69a,#e8b84a 55%,#b9852a);border:2px solid #fff1b8;border-radius:14px;
 box-shadow:0 4px 0 #6b4a12,0 8px 20px rgba(0,0,0,.55),inset 0 0 12px rgba(255,255,255,.4);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.bigbtn.alt{color:#f5e9ff;background:linear-gradient(#8a4fd0,#4a2275 55%,#2d1450);border-color:var(--gold);
 box-shadow:0 4px 0 #1a0a30,0 8px 20px rgba(0,0,0,.55),inset 0 0 12px rgba(200,150,255,.3);text-shadow:0 2px 0 #0007}
.bigbtn:active,.smbtn:active,.gbtn:active{transform:translateY(3px);filter:brightness(.9)}
.smbtn{flex:1;padding:11px 6px;font-weight:700;font-size:13px;color:var(--gold2);border-radius:11px;border:2px solid var(--gold);
 background:linear-gradient(#3a1a5e,#1a0b2e);box-shadow:0 3px 0 #0007}
.smbtn:disabled{opacity:.4}
.row{display:flex;gap:8px;width:100%;max-width:340px;margin-top:12px;position:relative;z-index:2}
.slotsWrap{width:100%;max-width:340px;margin-top:18px;position:relative;z-index:2}
.slotsWrap h3,.h3{margin:0 0 8px;font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;text-align:center}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:84px;border-radius:12px;border:2px solid #6b4a12;background:linear-gradient(#2a1346,#140822);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#cdb98a;position:relative}
.slot.full{border-color:var(--gold);box-shadow:0 0 14px rgba(232,184,74,.35),inset 0 0 14px rgba(232,184,74,.15);animation:glow 2s infinite}
.slot.empty{opacity:.55;border-style:dashed}
.slot svg{width:50px;height:42px}
.chsvg{overflow:visible}
.chsvg .lid{transition:transform .5s cubic-bezier(.3,1.5,.5,1);transform-origin:10px 42px}
.chsvg.open .lid{transform:rotate(-48deg)}
.subtitle{font-size:18px;letter-spacing:3px;color:var(--gold);margin:4px 0 12px;text-align:center;font-weight:900}
.backbtn{margin-top:14px;max-width:340px;width:100%}
/* tower cards */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.tcardx{--c:#e8b84a;border-radius:14px;padding:8px 8px 10px;text-align:center;border:2px solid var(--gold);position:relative;
 background:linear-gradient(165deg,#4a2275,#22103a 60%,#150a26);box-shadow:inset 0 0 22px rgba(232,184,74,.18),0 4px 14px #000a}
.tcardx .timg{height:150px;margin-bottom:4px;filter:drop-shadow(0 4px 6px #000)}
.tcardx .tn{font-weight:900;font-size:13px;color:var(--gold2)}
.tcardx .tg{font-size:15px;font-weight:900;color:#ffd24a;margin-top:2px;text-shadow:0 0 8px #ffb300}
.tcardx .tl{font-size:12px;color:#d9c3ff;margin:2px 0}
.pbar{height:9px;border-radius:6px;background:#000a;border:1px solid #6b4a12;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#8e44ff,#e0b3ff);transition:width .8s}
.tp{font-size:11px;color:#bba;margin-top:3px}
.tcardx.up{animation:upglow 1s infinite alternate;border-color:#fff1b8}
.tcardx.up::after{content:"УРОВЕНЬ ПОВЫШЕН!";position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:900;
 color:#2a1400;background:linear-gradient(#fff1b8,#e8b84a);padding:2px 8px;border-radius:8px;animation:pop .6s}
.timg{display:flex;align-items:center;justify-content:center;position:relative}
.timg img{max-width:100%;max-height:100%;object-fit:contain}
.timg .emo{display:none;font-size:42px}
.timg.noimg img{display:none}.timg.noimg .emo{display:block}
/* profile */
.pbox{width:100%;max-width:340px;border-radius:16px;border:2px solid var(--gold);padding:16px;background:linear-gradient(165deg,#3a1a5e,#150a26);box-shadow:inset 0 0 22px rgba(232,184,74,.18)}
.bigLv{width:96px;height:96px;margin:0 auto 8px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a1400;
 background:radial-gradient(circle at 35% 30%,#fff1b8,#e8b84a 60%,#a8741a);border:4px solid #fff1b8;box-shadow:0 0 24px rgba(255,190,60,.6)}
.bigLv small{font-size:10px;letter-spacing:2px;font-weight:700}.bigLv b{font-size:38px;line-height:1}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff14;font-size:14px}
/* lobby */
.lobbox{width:100%;max-width:340px;border-radius:14px;border:2px solid var(--gold);padding:14px;margin-bottom:12px;background:linear-gradient(165deg,#3a1a5e,#150a26)}
.code{font-size:40px;letter-spacing:8px;text-align:center;font-weight:900;color:var(--gold2);text-shadow:0 0 14px #ffb300;margin:8px 0}
input.codein{width:100%;padding:12px;font-size:24px;text-align:center;letter-spacing:6px;text-transform:uppercase;border-radius:10px;border:2px solid var(--gold);background:#0b0612;color:var(--gold2);font-family:inherit;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:#000a;border:1px solid #ffffff22;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#888;display:inline-block}
.dot.ok{background:#4cff7a;box-shadow:0 0 8px #4cff7a}.dot.wait{background:#bbb}.dot.retry{background:#ffd24a;animation:blink 1s infinite}.dot.down{background:#ff4c4c}
.reBtn{padding:5px 10px;border-radius:10px;border:2px solid var(--gold);background:linear-gradient(#7a3fc0,#3a1a6a);color:#fff;font-size:12px;font-weight:700;display:none}
.reBtn.show{display:inline-block}
/* game */
#game{padding:calc(52px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);overflow:hidden;align-items:stretch}
#ghud{display:flex;align-items:center;gap:6px;padding:4px 8px;flex:none}
.gst{flex:1;text-align:center;font-weight:900;font-size:14px;padding:5px 4px;border-radius:9px;background:#000a;border:1px solid #6b4a12;white-space:nowrap}
.gbtn{flex:none;width:38px;height:32px;border-radius:9px;border:2px solid var(--gold);background:linear-gradient(#3a1a5e,#1a0b2e);color:var(--gold2);font-size:14px;font-weight:900;padding:0}
.gbtn.go{width:auto;padding:0 10px;background:linear-gradient(#ffe69a,#e8b84a);color:#2a1400;animation:glow 1.5s infinite}
#netbar{display:none;align-items:center;justify-content:center;gap:8px;padding:2px 8px;flex:none}
#netbar.on{display:flex}
#cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 0}
#cv{display:block;border-radius:8px;border:2px solid #3a2760;box-shadow:0 0 20px #000;touch-action:none}
#panel{flex:none;height:152px;padding:6px 8px;display:flex;align-items:stretch;justify-content:center}
.hint{align-self:center;text-align:center;font-size:12px;color:#c9b6e8;line-height:1.5;padding:0 14px}
.bbar{display:flex;gap:5px;width:100%;align-items:stretch}
.bbtn{--c:#fff;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;border-radius:11px;border:2px solid var(--c);
 background:linear-gradient(165deg,#4a2275,#1a0b2e);color:#fff;font-size:11px;min-width:0}
.bbtn .bi{height:74px;width:100%}
.bbtn .bi .emo{font-size:30px}
.bbtn span{color:#ffd24a;font-weight:900;font-size:12px}
.bbtn.dis{opacity:.4;filter:grayscale(.6)}
.pcard{--c:#e8b84a;display:flex;gap:10px;width:100%;max-width:420px;border-radius:14px;border:2px solid var(--gold);padding:6px;
 background:linear-gradient(165deg,#4a2275,#22103a 60%,#150a26);box-shadow:inset 0 0 22px rgba(232,184,74,.2)}
.pcard.flash{animation:upglow .5s 3 alternate}
.pcard .pimg{width:84px;flex:none;height:100%;background:radial-gradient(circle,#5a2d8a,#1a0b2e);border-radius:10px;border:1px solid #ffffff22;filter:drop-shadow(0 3px 5px #000)}
.pcard .pimg img{height:100%}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:#d9c3ff}
.pinfo b{font-size:14px;color:var(--gold2)}
.pbtns{display:flex;gap:6px}
.pbtns button{flex:1;padding:8px 2px;border-radius:9px;border:2px solid var(--gold);font-weight:900;font-size:11px;color:#2a1400;background:linear-gradient(#ffe69a,#e8b84a)}
.pbtns button.sell{background:linear-gradient(#a33,#611);color:#fff;border-color:#f99}
.pbtns button.dis{opacity:.4}
/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(5,2,10,.93);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.ov.on{display:flex;animation:fadeIn .3s}
.chestBig{width:190px;height:160px;position:relative;margin-bottom:10px}
.chestBig svg{width:100%;height:100%}
.chestBig.shake svg{animation:shake .12s infinite}
.burst{position:absolute;left:50%;top:40%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(255,235,160,.95),rgba(255,200,80,0) 68%);transform:scale(0);opacity:0}
.burst.go{animation:burst 1s ease-out forwards}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin:6px 0 12px}
.rcard{opacity:0;transform:translateY(40px) scale(.7)}
.rcard.show{animation:cardIn .6s cubic-bezier(.2,1.4,.4,1) forwards}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:120;pointer-events:none;font-weight:900;font-size:30px;letter-spacing:3px;color:#fff1b8;
 text-shadow:0 0 20px #ffb300,0 3px 0 #5a3400;opacity:0}
#banner small{display:block;font-size:14px;letter-spacing:2px;color:#d9c3ff}
#banner.go{animation:banner 2.2s ease-out}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);z-index:130;padding:8px 16px;border-radius:20px;
 background:#1a0b2eee;border:2px solid var(--gold);font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.resT{font-size:36px;font-weight:900;letter-spacing:3px;margin:0 0 6px}
.resT.win{color:#ffd24a;text-shadow:0 0 20px #ffb300}.resT.lose{color:#ff6b6b;text-shadow:0 0 20px #f00}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes castleGlow{50%{filter:drop-shadow(0 0 26px rgba(255,200,80,1)) brightness(1.15)}}
img[data-raw]{opacity:0}
.menuCastle{width:96px;height:72px;margin:0 auto 2px;filter:drop-shadow(0 0 12px rgba(255,200,80,.7));animation:float 3s ease-in-out infinite,castleGlow 2.4s ease-in-out infinite}
.menuCastle .emo{font-size:40px;color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,200,80,.7),inset 0 0 14px rgba(232,184,74,.25)}}
@keyframes upglow{from{box-shadow:0 0 6px rgba(255,220,120,.4),inset 0 0 22px rgba(232,184,74,.2)}to{box-shadow:0 0 28px rgba(255,220,120,.95),inset 0 0 30px rgba(255,220,120,.45)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%{transform:translate(2px,0) rotate(-2deg)}50%{transform:translate(-3px,1px) rotate(2deg)}100%{transform:translate(2px,-1px) rotate(-1deg)}}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px) scale(.7) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateX(-50%) scale(0)}70%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
@keyframes banner{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes blink{50%{opacity:.35}}
.tcardx{border:3px solid var(--rc,#9aa0aa)!important;box-shadow:inset 0 0 18px var(--rg,transparent),0 0 12px var(--rg,transparent),0 4px 14px #000a}
.tgrid .tcardx .timg,.rgrid .tcardx .timg{height:130px}
.ribbon{position:absolute;top:-1px;left:-1px;z-index:2;padding:2px 9px;border-radius:11px 0 9px 0;font-size:9px;font-weight:900;letter-spacing:1px;color:#fff;background:var(--rc);text-shadow:0 1px 2px #000a}
.newb{position:absolute;top:-10px;right:6px;z-index:3;font-size:10px;font-weight:900;color:#2a1400;background:linear-gradient(#fff1b8,#e8b84a);padding:2px 8px;border-radius:8px;animation:pop2 .7s infinite alternate}
.tcardx.locked .timg{filter:grayscale(1) brightness(.4)}
.tcardx.locked{opacity:.85}
.lockov{position:absolute;left:0;right:0;top:46px;height:60px;display:flex;align-items:center;justify-content:center;font-size:34px;text-shadow:0 0 10px #000}
.bbar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bbtn{flex:0 0 64px!important}
@keyframes pop2{from{transform:scale(1)}to{transform:scale(1.15)}}
.listbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}
.hint2{text-align:center;font-size:12px;color:#c9b6e8;padding:10px}
.prow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid #6b4a12;background:linear-gradient(165deg,#32185a,#1a0b2e)}
.prow.me{border:2px solid var(--gold);box-shadow:0 0 12px rgba(232,184,74,.35)}
.prow .rk{width:34px;text-align:center;font-weight:900;color:var(--gold2);font-size:15px}
.prow .pn{flex:1;min-width:0}.prow .pn b{display:block;font-size:14px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{display:block;font-size:10px;color:#c9b6e8;line-height:1.4}
.prow .pst{text-align:right}.prow .pst b{font-size:14px;color:#fff}
.jbtn,.dbtn{border:2px solid var(--gold);border-radius:9px;padding:6px 8px;font-weight:900;font-size:11px;background:linear-gradient(#ffe69a,#e8b84a);color:#2a1400}
.dbtn{background:linear-gradient(#a33,#611);color:#fff;border-color:#f99;padding:6px}
input.nameIn{width:58%;padding:6px 8px;border-radius:8px;border:2px solid var(--gold);background:#0b0612;color:var(--gold2);font-family:inherit;font-size:14px;text-align:right;-webkit-user-select:text;user-select:text}
.loc{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;border:2px solid #6b4a12;background:linear-gradient(165deg,#3a1a5e,#150a26);box-shadow:0 4px 12px #000a}
.loc.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(232,184,74,.5)}
.loc img{width:54px;height:96px;border-radius:8px;border:1px solid #ffffff33;flex:none}
.loc .li{display:flex;flex-direction:column;gap:3px}.loc .li b{font-size:16px;color:var(--gold2)}.loc .li small{font-size:11px;color:#c9b6e8}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.chip{width:42px;height:42px;border-radius:50%;font-size:20px;border:2px solid #6b4a12;background:#1a0b2e;padding:0}
.chip.on{border-color:var(--gold);box-shadow:0 0 12px rgba(232,184,74,.7);background:#3a1a5e}
.chipname{width:100%;text-align:center;font-size:12px;color:var(--gold2);margin:4px 0 8px}
</style>
</head>
<body>
<canvas id="menuFx"></canvas>
<div id="topbar">
  <div id="lvlBadge"><div class="lv" id="lvNum">1</div><div><small>УРОВЕНЬ</small><div class="xpbar"><i id="lvXp"></i></div></div></div>
  <div id="goldBadge"><span class="coin"></span><b id="goldV">0</b></div>
</div>

<!-- MENU -->
<section id="menu" class="screen active">
  <div class="logo"><div class="timg menuCastle"><img data-n="castle_player" data-raw src="castle_player.png" alt="" draggable="false" onerror="this.parentNode.classList.add('noimg')"><span class="emo">♛</span></div><h1>TOWER<br>ROYAL</h1><p>Защити королевство</p></div>
  <div class="menuBtns">
    <button class="bigbtn" id="btnPlay">⚔ Играть</button>
    <button class="bigbtn alt" id="btnCoop">👥 Играть вдвоём</button>
  </div>
  <div class="slotsWrap"><h3>Сундуки</h3><div id="slots"></div></div>
  <div class="row">
    <button class="smbtn" id="btnTowers">🏰 Мои башни</button>
    <button class="smbtn" id="btnProfile">👤 Профиль</button>
    <button class="smbtn" id="btnMusic" style="flex:.5">🎵</button>
  </div>
  <div class="row">
    <button class="smbtn" id="btnRating">🏆 Рейтинг</button><button class="smbtn" id="btnFriends">👥 Друзья</button>
  </div>
</section>

<!-- TOWERS -->
<section id="towers" class="screen">
  <div class="subtitle">МОИ БАШНИ</div>
  <div class="tgrid" id="tgrid"></div>
  <button class="smbtn backbtn" data-go="menu">← Назад</button>
</section>

<!-- PROFILE -->
<section id="profile" class="screen">

  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||this.sfx);s.start(t);s.stop(t+d+.02)},

  else if(k==='poison'){this.tone(300,.2,'sine',.09,200);this.tone(450,.15,'sine',.06,150,.05)}else if(k==='lightning'){this.noise(.12,.25,5000);this.tone(1500,.15,'sawtooth',.07,-1100)}else if(k==='stone'){this.tone(140,.2,'square',.1,-70);this.noise(.1,.1,400)}else if(k==='wind'){this.noise(.3,.18,1800);this.tone(500,.25,'sine',.04,300)}

const Music={mode:'menu',next:0,step:0,timer:null,
 start(){if(this.timer||!Snd.ctx)return;this.next=Snd.ctx.currentTime+.1;this.timer=setInterval(()=>this.sched(),120)},
 dur(){return this.mode==='game'?.2:.42},
 sched(){const c=Snd.ctx;if(!c)return;if(c.state==='suspended')return;if(this.next<c.currentTime)this.next=c.currentTime+.05;
  while(this.next<c.currentTime+.35){this.play(this.step,this.next);this.next+=this.dur();this.step++}},
 play(step,t){const g=this.mode==='game',sd=this.dur(),roots=[57,53,48,55],bar=Math.floor(step/16)%4,root=roots[bar],third=bar===0?3:4;
  const f=n=>440*Math.pow(2,(n-69)/12),m=Snd.mus,notes=[root+12,root+12+third,root+19,root+24];
  if(step%16===0){Snd.toneAt(f(root-12),sd*16,'sawtooth',.07,t,m);Snd.toneAt(f(root-12+third),sd*16,'triangle',.06,t,m);Snd.toneAt(f(root-5),sd*16,'triangle',.05,t,m)}
  const pat=g?[0,1,2,1,3,2,1,2]:[0,2,1,2,0,2,1,2];Snd.toneAt(f(notes[pat[step%8]]),sd*1.6,'triangle',g?.12:.09,t,m);
  if(g){if(step%4===0)Snd.toneAt(120,.18,'sine',.5,t,m,-85);if(step%2===1)Snd.noiseAt(.05,.07,7000,t,m);if(step%8===0)Snd.toneAt(f(root-12),sd*4,'triangle',.25,t,m)}}
};

const PFX='towerroyal-v2-';
const Net={peer:null,conn:null,role:null,code:'',state:'idle',tries:0,timer:null,ct:null,leaving:false,lastRx:0,hb:null,ever:false,hostTries:0};
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const peerOpts=()=>({debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});
function setNet(state,txt){Net.state=state;
 [['lobDot','lobTxt','lobRe'],['netDot','netTxt','netRe']].forEach(([d,t,r])=>{$('#'+d).className='dot '+state;$('#'+t).textContent=txt;$('#'+r).classList.toggle('show',state==='retry'||state==='down')})}
function send(m){try{if(Net.conn&&Net.conn.open)Net.conn.send(m)}catch(e){}}
const connOpen=()=>!!(Net.conn&&Net.conn.open);
function killPeer(){clearTimeout(Net.timer);clearTimeout(Net.ct);const p=Net.peer,c=Net.conn;Net.peer=null;Net.conn=null;
 try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}
function stopHB(){clearInterval(Net.hb);Net.hb=null}

 if(performance.now()-Net.lastRx>9000){try{Net.conn.close()}catch(e){}}},2500)}
function leaveNet(){if(Net.role==='host'&&Online.on())Online.setRoom(null);Net.leaving=true;send({t:'bye'});stopHB();killPeer();Net.role=null;Net.ever=false;Net.tries=0;setNet('idle','Не подключено')}
function updateLobby(){$('#lobStart').disabled=!(Net.role==='host'&&connOpen())}
function peerError(e,p){if(Net.peer!==p||Net.leaving)return;const ty=e&&e.type;console.warn('Peer error',ty,e);
 if(ty==='unavailable-id'&&Net.role==='host'){Net.hostTries++;if(!G&&Net.hostTries<4)hostOpen(genCode());
  else if(Net.hostTries<10){setNet('retry','Ждём освобождения комнаты…');Net.timer=setTimeout(()=>hostOpen(Net.code),3000)}else setNet('down','Не удалось создать комнату');return}
 if(ty==='peer-unavailable'){if(Net.ever||G){setNet('retry','Хост недоступен, пробуем снова…');scheduleRetry()}else setNet('down','Комната не найдена. Проверьте код.');return}
 if(ty==='browser-incompatible'){setNet('down','Браузер не поддерживает WebRTC');return}
 if(['network','server-error','socket-error','socket-closed','webrtc','negotiation-failed','connection-failed'].includes(ty)||true){
  const msg=ty==='network'||ty==='socket-error'||ty==='socket-closed'||ty==='server-error'?'Нет связи с сервером PeerJS':'Ошибка соединения ('+ty+')';
  if(Net.role==='guest'){setNet('retry',msg);scheduleRetry()}else{setNet('retry',msg);setTimeout(()=>{if(Net.peer===p&&!p.destroyed){try{p.reconnect()}catch(e){}}},2500)}}}
function attachConn(c){
 if(Net.role==='host'){const old=Net.conn;Net.conn=c;if(old&&old!==c){try{old.close()}catch(e){}}}
 const onOpen=()=>{if(Net.conn!==c)return;clearTimeout(Net.ct);Net.tries=0;Net.ever=true;Net.lastRx=performance.now();
  setNet('ok',Net.role==='host'?'Игрок подключён':'Подключено к хосту');startHB();
  if(Net.role==='host'){send({t:'welcome'});if(G&&!G.over&&G.mode==='host'){send({t:'start',th:G.themeId});send(snap())}updateLobby()}
  else $('#lobTxt').textContent='Подключено! Ждём старта от хоста…'};
 if(c.open)onOpen();else c.on('open',onOpen);
 c.on('data',d=>{if(Net.conn===c)onData(d)});
 c.on('close',()=>{if(Net.conn!==c)return;Net.conn=null;stopHB();if(Net.leaving)return;
  if(Net.role==='host'){setNet('wait','Партнёр отключился. Ждём возвращения…');toast('Партнёр отключился');updateLobby()}
  else{setNet('retry','Связь потеряна. Переподключаемся…');scheduleRetry()}});
 c.on('error',e=>{console.warn('conn error',e);if(Net.conn===c&&Net.role==='guest'){setNet('retry','Ошибка соединения');}})}
function hostOpen(code){if(typeof Peer==='undefined'){setNet('down','PeerJS не загружен (нет интернета?)');return}
 killPeer();Net.leaving=false;Net.role='host';Net.code=code;setNet('wait','Создаём комнату…');
 let p;try{p=new Peer(PFX+code,peerOpts())}catch(e){setNet('down','Ошибка PeerJS');return}Net.peer=p;
 p.on('open',()=>{if(Net.peer!==p)return;Net.hostTries=0;Online.setRoom(code);$('#roomCode').textContent=code;$('#hostInfo').style.display='block';setNet(connOpen()?'ok':'wait',connOpen()?'Игрок подключён':'Ждём второго игрока…')});
 p.on('connection',c=>{if(Net.peer===p)attachConn(c)});
 p.on('disconnected',()=>{if(Net.peer!==p||Net.leaving)return;setNet('retry','Связь с сервером потеряна…');setTimeout(()=>{if(Net.peer===p&&!p.destroyed){try{p.reconnect()}catch(e){}}},1500)});
 p.on('close',()=>{if(Net.peer===p&&!Net.leaving)setNet('down','Соединение закрыто')});
 p.on('error',e=>peerError(e,p))}
function guestOpen(code){if(typeof Peer==='undefined'){setNet('down','PeerJS не загружен (нет интернета?)');return}
 killPeer();Net.leaving=false;Net.role='guest';Net.code=code;setNet('retry','Подключаемся…');
 let p;try{p=new Peer(peerOpts())}catch(e){setNet('down','Ошибка PeerJS');return}Net.peer=p;
 p.on('open',()=>{if(Net.peer===p)connectHost()});
 p.on('disconnected',()=>{if(Net.peer!==p||Net.leaving)return;try{p.reconnect()}catch(e){}});
 p.on('close',()=>{if(Net.peer===p&&!Net.leaving)scheduleRetry()});
 p.on('error',e=>peerError(e,p))}
function connectHost(){const p=Net.peer;if(!p||p.destroyed)return;const old=Net.conn;let c;try{c=p.connect(PFX+Net.code,{reliable:true})}catch(e){scheduleRetry();return}
 Net.conn=c;try{old&&old.close()}catch(e){}attachConn(c);clearTimeout(Net.ct);
 Net.ct=setTimeout(()=>{if(Net.conn===c&&!c.open){try{c.close()}catch(e){}Net.conn=null;scheduleRetry()}},12000)}
function scheduleRetry(){if(Net.role!=='guest'||Net.leaving)return;clearTimeout(Net.timer);Net.tries++;
 if(Net.tries>12){setNet('down','Не удалось подключиться. Нажмите «Переподключиться».');return}
 setNet('retry',`Переподключение… (${Net.tries})`);Net.timer=setTimeout(()=>guestOpen(Net.code),Math.min(1200*Net.tries,7000))}

$('#lobRe').onclick=$('#netRe').onclick=manualReconnect;

 ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.strokeText(Math.ceil(m.hp),m.x,by+bh/2+.5);ctx.fillStyle='#fff';ctx.fillText(Math.ceil(m.hp),m.x,by+bh/2+.5)}
const FXK=k=>k==='holy'?'fx_holy_soft':'fx_'+k,FXH=k=>k==='holy'?'fx_holy_hit_soft':'fx_'+k+'_hit';
const FXC={arrow:'#fff2c0',ice:'#9fe0ff',fire:'#ff8a2a',holy:'#fff0a0',poison:'#8aff4a',lightning:'#9fd8ff',stone:'#d8b878',wind:'#dff6ff'};
const FXSZ={arrow:30,ice:26,fire:30,holy:30,poison:28,lightning:46,stone:26,wind:30};
const FXHS={arrow:30,ice:48,fire:74,holy:58,poison:58,lightning:64,stone:72,wind:64};
function drawProj(p,time){const k=p.kind,x=p.x,y=p.y-p.z,key=FXK(k),off=FX_ROT[k]||0,add=!(k==='arrow'||k==='stone');
 if(p.z>1){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(p.x,p.y+3,5,2.5,0,0,7);ctx.fill()}
 if(add)glow(x,y,k==='lightning'?30:k==='fire'?26:22,FXC[k],k==='lightning'?.9:.7);
 let rot=p.ang,w=FXSZ[k]||28;
 if(k==='ice'||k==='wind')rot=p.spin;else if(k==='fire')rot=p.ang+Math.sin(p.age*30)*.2;else if(k==='holy')rot=p.spin*.4;else if(k==='poison')rot=p.spin*.3;else if(k==='stone')rot=p.spin;else if(k==='lightning')rot=p.ang+(Math.random()-.5)*.25;
 if(k==='fire')w*=1+Math.sin(p.age*30)*.08;if(k==='holy')w*=1+Math.sin(p.age*14)*.12;if(k==='poison')w*=1+Math.sin(p.age*10)*.1;
 if(okImg(key)){ctx.save();if(add)ctx.globalCompositeOperation='lighter';drawSprite(IMG[key],x,y,w,rot+off);ctx.restore()}
 else{ctx.save();ctx.translate(x,y);
  if(k==='arrow'){ctx.rotate(p.ang);ctx.strokeStyle='#d9c28a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(8,0);ctx.stroke();ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(6,-3);ctx.lineTo(6,3);ctx.fill()}
  else if(k==='ice'){ctx.rotate(p.spin);ctx.fillStyle='#bfeaff';ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(5,0);ctx.lineTo(0,9);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.stroke()}
  else if(k==='fire'){ctx.fillStyle='#ff7a1a';circ(0,0,7);ctx.fill();ctx.fillStyle='#ffd24a';circ(0,0,4);ctx.fill()}
  else if(k==='holy'){ctx.fillStyle='#fff6c0';circ(0,0,6);ctx.fill();ctx.rotate(p.spin);ctx.fillStyle='#ffe27a';ctx.fillRect(-1,-10,2,20);ctx.fillRect(-10,-1,20,2)}
  else if(k==='poison'){ctx.fillStyle='#6fe03a';circ(0,0,6*(w/28));ctx.fill();ctx.fillStyle='#c8ff9a';circ(-2,-2,2);ctx.fill()}
  else if(k==='lightning'){ctx.rotate(p.ang);ctx.strokeStyle='#cfe8ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,0);for(let i=-14;i<14;i+=5)ctx.lineTo(i,(Math.random()-.5)*8);ctx.lineTo(14,0);ctx.stroke()}
  else if(k==='stone'){ctx.rotate(rot);ctx.fillStyle='#8a7a68';ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(-2,-8);ctx.lineTo(7,-4);ctx.lineTo(6,6);ctx.lineTo(-4,7);ctx.closePath();ctx.fill();ctx.strokeStyle='#4a3c30';ctx.lineWidth=1.5;ctx.stroke()}
  else{ctx.rotate(rot);ctx.strokeStyle='#e8fbff';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.rotate(2.094);ctx.beginPath();ctx.arc(5,0,5,-1.5,1.5);ctx.stroke()}}
  ctx.restore()}}
function drawFx(f){const u=f.t/f.dur,k=f.kind,e=1-(1-u)*(1-u);
 if(k==='ring'){ctx.strokeStyle=`rgba(255,226,122,${1-u})`;ctx.lineWidth=3*(1-u)+1;circ(f.x,f.y,8+e*30);ctx.stroke();return}
 if(k==='slash'){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.ang);ctx.strokeStyle=`rgba(255,255,255,${1-u})`;ctx.lineWidth=4*(1-u)+1;ctx.beginPath();ctx.arc(0,0,14,-1.2+u*1.2,.2+u*1.4);ctx.stroke();ctx.restore();return}
 if(k==='arc'){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-u;ctx.lineJoin='round';
  for(const[w,c]of[[7,'rgba(90,170,255,.35)'],[3,'rgba(190,230,255,.9)'],[1.2,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();f.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}ctx.restore();return}
 const base=FXHS[k]||40,key=FXH(k),sc=.45+e*.95,al=Math.max(0,1-u*u),gc=FXC[k]||'#fff';
 glow(f.x,f.y,base*(.5+e*.6),gc,al*.9);
 if(okImg(key)){ctx.save();if(k!=='arrow'&&k!=='stone')ctx.globalCompositeOperation='lighter';drawSprite(IMG[key],f.x,f.y,base*sc,f.rot+u*.7,al);ctx.restore()}
 else{ctx.strokeStyle=gc;ctx.globalAlpha=al;ctx.lineWidth=3;circ(f.x,f.y,base*.5*sc);ctx.stroke();ctx.globalAlpha=1}
 ctx.strokeStyle=`rgba(255,255,255,${al*.6})`;ctx.lineWidth=2*(1-u)+.5;circ(f.x,f.y,base*.6*e);ctx.stroke()}
function render(){const time=performance.now()/1000;ctx.setTransform(DPR*VS,0,0,DPR*VS,0,0);ctx.clearRect(0,0,CW,CH);
 ctx.save();if(G.shake>0){const a=Math.min(1,G.shake*6)*3;ctx.translate(rand(-a,a),rand(-a,a))}
 ctx.drawImage(MAPC,0,0,CW,CH);
 const sel=G.sel;if(sel&&sel.kind==='cell'){ctx.strokeStyle=`rgba(255,226,122,${.6+Math.sin(time*6)*.3})`;ctx.lineWidth=2.5;ctx.fillStyle='rgba(255,226,122,.18)';ctx.fillRect(sel.cx*CELL+2,sel.cy*CELL+2,CELL-4,CELL-4);ctx.strokeRect(sel.cx*CELL+2,sel.cy*CELL+2,CELL-4,CELL-4)}
 if(sel&&sel.kind==='tower'){const t=G.towers.find(t=>t.id===sel.id);if(t){const st=tStats(t);ctx.fillStyle='rgba(255,226,122,.1)';ctx.strokeStyle='rgba(255,226,122,.7)';ctx.lineWidth=1.5;circ(t.x,t.y,st.range);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff1b8';ctx.lineWidth=2;ctx.strokeRect(t.cx*CELL+1,t.cy*CELL+1,CELL-2,CELL-2)}}
 drawCastle('enemy',MAP.ec[0],MAP.ec[1],MAP.ec[2],time);drawCastle('player',MAP.pc[0],MAP.pc[1],MAP.pc[2],time);
 for(const t of G.towers)drawTower(t,time);
 [...G.monsters].sort((a,b)=>a.y-b.y).forEach(m=>drawMon(m,time));
 for(const dd of G.dying)drawDying(dd);
 for(const p of G.projs)drawProj(p,time);
 for(const f of G.fx)drawFx(f);
 for(const p of G.parts){const a=Math.max(0,p.life/p.max);ctx.save();if(p.glow)ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.fillStyle=p.col;circ(p.x,p.y,p.size*(.4+a*.6));ctx.fill();ctx.restore()}
 ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 for(const t of G.texts){const a=1-t.t/.8;ctx.globalAlpha=a;ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y)}
 ctx.globalAlpha=1;
 drawAmb(G.rdt||.016,time);
 if(G.co&&Net.state!=='ok'&&G.mode==='host'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,CW,22);ctx.fillStyle='#ffd24a';ctx.font='bold 11px sans-serif';ctx.fillText('Партнёр не в сети — игра продолжается',CW/2,11)}
 ctx.restore()}
cv.addEventListener('pointerdown',e=>{if(!G||G.over)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*CW,y=(e.clientY-r.top)/r.height*CH;
 const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL);if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;Snd.ui();
 const t=G.towers.find(t=>t.cx===cx&&t.cy===cy);
 if(t)G.sel={kind:'tower',id:t.id};else if(!BLOCK.has(cx+','+cy))G.sel={kind:'cell',cx,cy};else G.sel=null;updatePanel()});

/* ================= MAIN LOOP ================= */
let last=0,snapT=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(G&&curScreen==='game'){
  if(G.mode==='guest')guestStep(dt);
  else{for(let i=0;i<G.speed;i++)simStep(dt);if(G.mode==='host'){snapT-=dt;if(snapT<=0&&connOpen()){snapT=.1;send(snap())}}}
  if(G){G.rdt=dt;render();updateHUD()}}
 else menuFx(dt)}
/* menu embers */
const mf=$('#menuFx'),mx=mf.getContext('2d');let embers=[];
function menuFx(dt){if(curScreen==='game')return;const w=mf.width=innerWidth,h=mf.height=innerHeight;mx.clearRect(0,0,w,h);
 if(embers.length<45&&Math.random()<.4)embers.push({x:Math.random()*w,y:h+10,v:20+Math.random()*40,s:1+Math.random()*2.5,p:Math.random()*6});
 mx.globalCompositeOperation='lighter';for(const e of embers){e.y-=e.v*dt;e.x+=Math.sin(e.y/30+e.p)*.4;const a=Math.max(0,Math.min(1,e.y/h));mx.fillStyle=`rgba(255,${150+e.s*30|0},60,${a*.7})`;mx.beginPath();mx.arc(e.x,e.y,e.s,0,7);mx.fill()}
 embers=embers.filter(e=>e.y>-10)}
renderAll();Online.push();setInterval(()=>{if(!document.hidden)Online.push(Net.role==='host'&&Net.code&&Net.peer?{room:Net.code}:{})},60000);requestAnimationFrame(frame);
</script>
